<!doctype html><html><head><meta charset="utf-8">
<!-- Source for app/opengraph-image.png (1200x630). To change the link card, edit this file, open it in a browser at 1200x630, and save a screenshot over app/opengraph-image.png. The app icon source is app/icon.svg. -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Instrument+Serif&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{font-family:'Hanken Grotesk',sans-serif;background:#f7f1e8;color:#1c1b1a;display:grid;grid-template-columns:1fr 470px;align-items:center;gap:56px;padding:0 80px;position:relative;overflow:hidden}
.mark{width:72px;height:72px;margin-bottom:36px}
h1{font-family:'Instrument Serif',serif;font-size:104px;line-height:1;font-weight:400;font-synthesis:none;letter-spacing:-0.01em}
.sub{margin-top:24px;font-size:31px;line-height:1.3;font-weight:500;color:#5e5a54;max-width:560px}
.foot{position:absolute;left:80px;bottom:44px;font-size:22px;font-weight:600;color:#5e5a54;letter-spacing:.01em}
.card{background:#fffdf8;color:#1c1b1a;border-radius:16px;padding:30px 30px 28px;border:2px solid #e1dcd3}
.row{display:flex;align-items:center;gap:18px;background:#eef0e4;border-radius:24px;padding:16px 18px}
.big{width:58px;height:58px;border-radius:50%;background:#4f6150;display:flex;align-items:center;justify-content:center;flex:none}
.t{font-size:31px;font-weight:700;color:#34432f}.m{font-size:22px;color:#5e5a54;font-weight:500;margin-top:2px}
.done{margin-left:auto;font-size:24px;font-weight:700;color:#34432f}
.days{display:grid;grid-template-columns:repeat(7,1fr);margin-top:24px;text-align:center}
.days span{font-size:19px;color:#5e5a54;font-weight:500}
.days .today{color:#1c1b1a;font-weight:700}
.dot{width:38px;height:38px;margin:10px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.c{background:#4f6150}.up{border:2px dashed #cfc9bf}.mi{width:12px;height:12px;background:#878279;margin-top:23px;margin-bottom:13px}
.count{margin-top:20px;font-size:22px;color:#5e5a54;font-weight:500}
</style></head><body>
<div>
  <h1>Family Health<br>Tracker</h1>
  <p class="sub">Set a goal. Check in each day.<br>Cheer each other on.</p>
</div>
<div class="card">
  <div class="row">
    <div class="big"><svg width="30" height="30" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><div class="t">Daily walk</div><div class="m">Every day</div></div>
    <div class="done">Done</div>
  </div>
  <div class="days" id="days"></div>
  <div class="count">4 of 7 this week</div>
</div>
<p class="foot">ACC 556 final project</p>
<script>
const ck='<svg width="20" height="20" viewBox="0 0 20 20"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const d=[["Sun","c"],["Mon","c"],["Tue","mi"],["Wed","c"],["Today","c"],["Fri","up"],["Sat","up"]];
document.getElementById('days').innerHTML=d.map(([l,s])=>`<div><span class="${l==='Today'?'today':''}">${l}</span><div class="dot ${s}">${s==='c'?ck:''}</div></div>`).join('');
</script>
</body></html>
